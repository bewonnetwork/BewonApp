name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: AIzaSyBAOhuiNGXxMjTbvw2DShZJPg9hHqXTv-A
      VITE_FIREBASE_AUTH_DOMAIN: bewonapp-bf500.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: bewonapp-bf500
      VITE_FIREBASE_STORAGE_BUCKET: bewonapp-bf500.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "396096261224"
      VITE_FIREBASE_APP_ID: 1:396096261224:web:8c03a05404f933b6a23fdd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and build web app
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Sync to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ChatCall-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
